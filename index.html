<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дневник тренировок</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 12px;
      padding-bottom: 50px;
    }

    h1 {
      font-size: 1.2rem;
      text-align: center;
      color: #4da6ff;
      margin: 5px 0 12px 0;
    }

    /* Статистика и авто-счетчик стажа */
    .stats-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: center;
    }

    .stats-main {
      font-size: 1.15rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .stats-sub {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    #pwaInstallBtn {
      display: block;
      width: 100%;
      padding: 10px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Навигация по дням */
    .days-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
    }

    .day-tab {
      flex: 1;
      padding: 8px 6px;
      background: #222;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.75rem;
      text-align: center;
      white-space: nowrap;
    }

    .day-tab.active {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
    }

    .day-date-sub {
      font-size: 0.65rem;
      font-weight: normal;
      display: block;
      margin-top: 2px;
      opacity: 0.85;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    /* Кнопки-аккордеоны */
    .accordion-btn {
      width: 100%;
      padding: 10px;
      background: #1e1e1e;
      border: 1px dashed #444;
      color: #a5b4fc;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .accordion-content {
      display: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .form-group { margin-bottom: 8px; }

    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      background: #121212;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
    }

    .btn-main {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Карточки упражнений */
    .exercise-card {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #2a2a2a;
      position: relative;
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .ex-title {
      font-weight: bold;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 2px;
      padding-right: 20px;
    }

    .ex-target {
      font-size: 0.75rem;
      color: #4da6ff;
      margin-bottom: 8px;
    }

    .btn-gear {
      background: none;
      border: none;
      color: #666;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 2px 4px;
    }

    .btn-gear:hover { color: #aaa; }

    .set-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.8rem;
      background: #262626;
      padding: 4px 8px;
      border-radius: 6px;
    }

    input[type="number"] {
      width: 50px;
      padding: 4px;
      border: 1px solid #444;
      background: #121212;
      color: #fff;
      border-radius: 4px;
      text-align: center;
      font-size: 0.85rem;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #007bff;
      margin-left: auto;
    }

    .actions-hidden {
      display: none;
      gap: 8px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px dashed #333;
    }

    .btn-small {
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-edit { background: #4b5563; color: white; }
    .btn-delete { background: #dc3545; color: white; }

    /* Блок Синхронизации и Бэкапа */
    .sync-card {
      background: #1a1a24;
      border: 1px solid #3b3b58;
      border-radius: 10px;
      padding: 12px;
      margin-top: 15px;
    }

    .btn-sync {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
      font-size: 0.8rem;
    }

    .history-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
      font-size: 0.8rem;
    }

    .history-header {
      font-weight: bold;
      color: #f43f5e;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .history-body {
      display: none;
      margin-top: 8px;
      white-space: pre-line;
      color: #d4d4d8;
      border-top: 1px solid #3f3f46;
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <h1>🏋️‍♂️ Трекер рекомпозиции</h1>

  <!-- Статистика стажа -->
  <div class="stats-card">
    <div class="stats-main" id="daysCounter">Загрузка стажа...</div>
    <div class="stats-sub" id="startDateText">Старт: ...</div>
    <div style="margin-top:6px; display:flex; justify-content:center; gap:8px;">
      <button class="btn-small btn-edit" onclick="resetStartDate()">⚙️ Дата старта</button>
      <button class="btn-small btn-edit" style="background:#0284c7;" onclick="configureSchedule()">📅 Расписание дней</button>
    </div>
  </div>

  <button id="pwaInstallBtn">📲 Установить приложение</button>

  <div class="days-nav" id="daysNav"></div>

  <div class="day-header">
    <div>
      <h3 id="currentDayTitle" style="margin: 0; color:#4da6ff; display:inline-block;">День 1</h3>
      <span id="currentDayDate" style="font-size:0.85rem; color:#a5b4fc; margin-left:8px;"></span>
    </div>
  </div>

  <!-- СКРЫВАЕМЫЙ БЛОК: Управление днем и добавление упражнений -->
  <button class="accordion-btn" onclick="toggleAccordion('editDaySection')">
    <span>✏️ Добавить упражнение / Настройки дня</span>
    <span id="icon_editDaySection">▼</span>
  </button>
  <div class="accordion-content" id="editDaySection">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
      <span id="form-title" style="font-weight:bold; font-size:0.85rem; color:#4da6ff;">+ Новое упражнение</span>
      <button class="btn-small btn-delete" onclick="deleteCurrentDay()">🗑 Удалить этот день</button>
    </div>
    
    <input type="hidden" id="editIndex" value="-1">
    <div class="form-group">
      <input type="text" id="exName" placeholder="Название упражнения">
    </div>
    <div class="form-group">
      <input type="text" id="exTarget" placeholder="Цель (например: 14-16 кг × 10-12)">
    </div>
    <button class="btn-main" onclick="saveExercise()">Сохранить упражнение</button>
  </div>

  <div id="exercisesContainer"></div>

  <!-- СКРЫВАЕМЫЙ БЛОК: Сохранение, Бэкап и Отчеты -->
  <button class="accordion-btn" style="border-color: #3b3b58; color: #a5b4fc;" onclick="toggleAccordion('backupSection')">
    <span>💾 Отчеты, сброс и Бэкап данных</span>
    <span id="icon_backupSection">▼</span>
  </button>
  <div class="accordion-content" id="backupSection">
    <button class="btn-sync" style="background:#22c55e;" onclick="saveCurrentDayToHistory()">📅 Зафиксировать день в историю</button>
    <button class="btn-sync" onclick="exportReport()">📋 Скопировать отчет за все дни</button>
    <button class="btn-small btn-delete" style="width:100%; margin-bottom:10px; background:#374151; padding:8px;" onclick="clearCurrentResults()">🧹 Сбросить веса на сегодня</button>

    <div style="font-size:0.75rem; color:#a5b4fc; margin-top:10px; margin-bottom:4px; font-weight:bold;">Резервная копия файла:</div>
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <button class="btn-sync" style="background:#0284c7; margin:0;" onclick="downloadBackup()">💾 Скачать бэкап</button>
      <button class="btn-sync" style="background:#0369a1; margin:0;" onclick="document.getElementById('fileInput').click()">📂 Восстановить</button>
    </div>
    <input type="file" id="fileInput" style="display:none" accept=".json" onchange="restoreBackup(event)">

    <div style="font-size:0.75rem; color:#aaa; margin-top:8px; margin-bottom:4px;">Загрузить план от тренера (JSON):</div>
    <textarea id="importInput" rows="2" placeholder="Вставьте JSON..."></textarea>
    <button class="btn-sync" style="background:#10b981; margin-top:6px;" onclick="importProgram()">📥 Загрузить новый план</button>
  </div>

  <!-- Раздел сохраненной истории -->
  <div style="margin-top: 15px;">
    <h3 style="font-size:1rem; color:#a5b4fc; margin-bottom:8px;">📜 История тренировок</h3>
    <div id="historyContainer"></div>
  </div>

  <script>
    const originalProgram = [
      {
        dayName: 'День 1',
        exercises: [
          { name: 'Жим гантелей лежа', target: 'Цель: 14-16 кг × 10-12', sets: 4 },
          { name: 'Брусья (негативы)', target: 'Цель: Свой вес × 6-8', sets: 4 },
          { name: 'Жим гантелей сидя', target: 'Цель: 8-10 кг × 10-12', sets: 3 },
          { name: 'Махи в стороны', target: 'Цель: 4-6 кг × 12-15', sets: 3 },
          { name: 'Отжимания от скамьи', target: 'Цель: Свой вес × 10-12', sets: 3 }
        ]
      },
      {
        dayName: 'День 2',
        exercises: [
          { name: 'Подтягивания', target: 'Цель: Свой вес × MAX', sets: 3 },
          { name: 'Тяга гантели к поясу', target: 'Цель: 16-18 кг × 10-12', sets: 4 },
          { name: 'Махи в наклоне', target: 'Цель: 4-6 кг × 12-15', sets: 3 },
          { name: "Сгибания 'Молот'", target: 'Цель: 8-10 кг × 10-12', sets: 4 },
          { name: 'Подъем ног в висе', target: 'Цель: Свой вес × 8-12', sets: 3 }
        ]
      },
      {
        dayName: 'День 3',
        exercises: [
          { name: 'Скакалка', target: 'Цель: 3 раунда × 2 мин', sets: 3 },
          { name: 'Зашагивания на скамью', target: 'Цель: 8-10 кг × 10-12', sets: 4 },
          { name: 'Румынская тяга', target: 'Цель: 12-15 кг × 12', sets: 4 },
          { name: 'Забеги по лестнице', target: 'Цель: 5 подъемов', sets: 5 },
          { name: 'Подъемы на носки', target: 'Цель: Свой вес × 15-20', sets: 4 }
        ]
      }
    ];

    let workoutData = JSON.parse(localStorage.getItem('my_full_workout_v3')) || originalProgram;
    let historyData = JSON.parse(localStorage.getItem('workout_history')) || [];
    let activeDayIndex = 0;

    const daysOfWeekShort = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
    const monthsShort = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

    function getDayCalculatedDate(dayIndex) {
      let startDateStr = localStorage.getItem('workout_start_date');
      if (!startDateStr) startDateStr = new Date().toISOString().split('T')[0];
      
      const restDaysInterval = parseInt(localStorage.getItem('workout_day_step') || '2'); // По умолчанию через 2 дня
      const baseDate = new Date(startDateStr);
      
      // Расчет даты дня (каждый день тренировки идет с шагом restDaysInterval)
      const targetDate = new Date(baseDate);
      targetDate.setDate(baseDate.getDate() + (dayIndex * restDaysInterval));

      const dayOfWeek = daysOfWeekShort[targetDate.getDay()];
      const dayNum = targetDate.getDate();
      const monthName = monthsShort[targetDate.getMonth()];

      return {
        formattedStr: `${dayOfWeek}, ${dayNum} ${monthName}`,
        fullDate: targetDate
      };
    }

    function configureSchedule() {
      const step = prompt('Укажите интервал между тренировочными днями в днях (например, 2 = тренировка через день, 1 = каждый день):', localStorage.getItem('workout_day_step') || '2');
      if (step && !isNaN(parseInt(step))) {
        localStorage.setItem('workout_day_step', step);
        render();
      }
    }

    function toggleAccordion(id) {
      const content = document.getElementById(id);
      const icon = document.getElementById('icon_' + id);
      if (content.style.display === 'block') {
        content.style.display = 'none';
        icon.innerText = '▼';
      } else {
        content.style.display = 'block';
        icon.innerText = '▲';
      }
    }

    function toggleExActions(idx) {
      const actions = document.getElementById(`exActions_${idx}`);
      actions.style.display = actions.style.display === 'flex' ? 'none' : 'flex';
    }

    function initStartDate() {
      let startDateStr = localStorage.getItem('workout_start_date');
      if (!startDateStr) {
        startDateStr = new Date().toISOString().split('T')[0];
        localStorage.setItem('workout_start_date', startDateStr);
      }
      updateStatsUI(startDateStr);
    }

    function updateStatsUI(startDateStr) {
      const start = new Date(startDateStr);
      const today = new Date();
      const diffTime = today.getTime() - start.getTime();
      const diffDays = Math.max(1, Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1);
      const months = (diffDays / 30.44).toFixed(1);

      document.getElementById('daysCounter').innerText = `🔥 Занимаюсь: ${diffDays} дн. (~${months} мес.)`;
      document.getElementById('startDateText').innerText = `Дата старта: ${startDateStr}`;
    }

    function resetStartDate() {
      const newDate = prompt('Укажите реальную дату первого дня тренировок (ГГГГ-ММ-ДД):');
      if (newDate && !isNaN(Date.parse(newDate))) {
        localStorage.setItem('workout_start_date', newDate);
        updateStatsUI(newDate);
        render();
      } else if (newDate) {
        alert('Некорректный формат!');
      }
    }

    function renderDaysNav() {
      const nav = document.getElementById('daysNav');
      nav.innerHTML = '';

      workoutData.forEach((day, index) => {
        const dateInfo = getDayCalculatedDate(index);
        const btn = document.createElement('button');
        btn.className = `day-tab ${index === activeDayIndex ? 'active' : ''}`;
        btn.innerHTML = `${day.dayName}<span class="day-date-sub">${dateInfo.formattedStr}</span>`;
        btn.onclick = () => { activeDayIndex = index; render(); };
        nav.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'day-tab';
      addBtn.style.borderStyle = 'dashed';
      addBtn.style.color = '#28a745';
      addBtn.innerText = '+ День';
      addBtn.onclick = addNewDay;
      nav.appendChild(addBtn);
    }

    function renderExercises() {
      const container = document.getElementById('exercisesContainer');
      const currentDay = workoutData[activeDayIndex];
      const dateInfo = getDayCalculatedDate(activeDayIndex);

      document.getElementById('currentDayTitle').innerText = currentDay.dayName;
      document.getElementById('currentDayDate').innerText = `— ${dateInfo.formattedStr}`;

      container.innerHTML = '';

      if (!currentDay.exercises || currentDay.exercises.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#777; font-size:0.85rem;">Нет упражнений. Откройте настройки выше, чтобы добавить.</p>';
        return;
      }

      currentDay.exercises.forEach((ex, exIdx) => {
        const setsCount = ex.sets || 4;
        let setsHtml = '';

        for (let s = 1; s <= setsCount; s++) {
          const key = `d${activeDayIndex}_e${exIdx}_s${s}`;
          const savedW = localStorage.getItem(key + '_w') || '';
          const savedR = localStorage.getItem(key + '_r') || '';
          const savedC = localStorage.getItem(key + '_c') === 'true' ? 'checked' : '';

          setsHtml += `
            <div class="set-row">
              <span>Сет ${s}:</span>
              <input type="number" placeholder="кг" value="${savedW}" oninput="saveVal('${key}_w', this.value)">
              <span>кг ×</span>
              <input type="number" placeholder="повт" value="${savedR}" oninput="saveVal('${key}_r', this.value)">
              <input type="checkbox" ${savedC} onclick="saveVal('${key}_c', this.checked)">
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = 'exercise-card';
        card.innerHTML = `
          <div class="ex-header">
            <div>
              <div class="ex-title">${ex.name}</div>
              <div class="ex-target">${ex.target}</div>
            </div>
            <button class="btn-gear" onclick="toggleExActions(${exIdx})" title="Настройки">⚙️</button>
          </div>
          <div>${setsHtml}</div>
          <div class="actions-hidden" id="exActions_${exIdx}">
            <button class="btn-small btn-edit" onclick="editExercise(${exIdx})">✏️ Изменить</button>
            <button class="btn-small btn-delete" onclick="deleteExercise(${exIdx})">🗑 Удалить</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function saveVal(key, val) { localStorage.setItem(key, val); }

    function saveExercise() {
      const nameInput = document.getElementById('exName');
      const targetInput = document.getElementById('exTarget');
      const editIndex = parseInt(document.getElementById('editIndex').value);

      if (!nameInput.value.trim()) return alert('Введите название!');

      const item = {
        name: nameInput.value.trim(),
        target: targetInput.value.trim() ? targetInput.value.trim() : 'Цель не указана',
        sets: 4
      };

      if (editIndex === -1) {
        workoutData[activeDayIndex].exercises.push(item);
      } else {
        workoutData[activeDayIndex].exercises[editIndex] = item;
        document.getElementById('editIndex').value = "-1";
        document.getElementById('form-title').innerText = "+ Новое упражнение";
      }

      nameInput.value = '';
      targetInput.value = '';
      persistAndRender();
    }

    function addNewDay() {
      const name = prompt('Название дня:');
      if (name) {
        workoutData.push({ dayName: name, exercises: [] });
        activeDayIndex = workoutData.length - 1;
        persistAndRender();
      }
    }

    function deleteCurrentDay() {
      if (workoutData.length <= 1) return alert('Нельзя удалить единственный день!');
      if (confirm(`Удалить "${workoutData[activeDayIndex].dayName}"?`)) {
        workoutData.splice(activeDayIndex, 1);
        activeDayIndex = 0;
        persistAndRender();
      }
    }

    function editExercise(index) {
      const ex = workoutData[activeDayIndex].exercises[index];
      document.getElementById('exName').value = ex.name;
      document.getElementById('exTarget').value = ex.target;
      document.getElementById('editIndex').value = index;
      document.getElementById('form-title').innerText = "✏️ Изменить упражнение";
      
      document.getElementById('editDaySection').style.display = 'block';
      document.getElementById('icon_editDaySection').innerText = '▲';
      window.scrollTo({ top: 200, behavior: 'smooth' });
    }

    function deleteExercise(index) {
      if (confirm('Удалить упражнение?')) {
        workoutData[activeDayIndex].exercises.splice(index, 1);
        persistAndRender();
      }
    }

    function generateDayReportText(dayIndex) {
      const day = workoutData[dayIndex];
      const dateInfo = getDayCalculatedDate(dayIndex);
      let report = `═══ ${day.dayName.toUpperCase()} (${dateInfo.formattedStr}) ═══\n`;
      
      day.exercises.forEach((ex, eIdx) => {
        report += `🔹 ${ex.name} (${ex.target})\n`;
        let setsDone = [];
        const setsCount = ex.sets || 4;
        for (let s = 1; s <= setsCount; s++) {
          const key = `d${dayIndex}_e${eIdx}_s${s}`;
          const w = localStorage.getItem(key + '_w');
          const r = localStorage.getItem(key + '_r');
          const c = localStorage.getItem(key + '_c') === 'true';
          
          if (w || r || c) {
            setsDone.push(`Сет ${s}: ${w || 0}кг × ${r || 0} повт ${c ? '✅' : '❌'}`);
          }
        }
        if (setsDone.length > 0) report += "   " + setsDone.join("\n   ") + "\n";
        else report += "   (Нет записей)\n";
      });

      return report;
    }

    function exportReport() {
      let fullReport = "📊 **ОТЧЕТ ПО ТРЕНИРОВКАМ**\n\n";
      workoutData.forEach((_, idx) => {
        fullReport += generateDayReportText(idx) + "\n";
      });

      navigator.clipboard.writeText(fullReport).then(() => {
        alert('✅ Отчет скопирован в буфер обмена!');
      }).catch(() => alert('Скопируйте вручную:\n\n' + fullReport));
    }

    function saveCurrentDayToHistory() {
      const currentDay = workoutData[activeDayIndex];
      const dateInfo = getDayCalculatedDate(activeDayIndex);
      const reportText = generateDayReportText(activeDayIndex);

      const dayRecord = {
        title: `${currentDay.dayName} — ${dateInfo.formattedStr}`,
        content: reportText
      };

      historyData.unshift(dayRecord);
      localStorage.setItem('workout_history', JSON.stringify(historyData));

      renderHistory();
      alert(`🎉 День "${currentDay.dayName}" зафиксирован в Историю (${dateInfo.formattedStr})!`);
    }

    function renderHistory() {
      const container = document.getElementById('historyContainer');
      container.innerHTML = '';

      if (historyData.length === 0) {
        container.innerHTML = '<p style="color:#666; font-size:0.8rem;">История пока пуста. Зафиксируйте свой первый день!</p>';
        return;
      }

      historyData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'history-card';
        card.innerHTML = `
          <div class="history-header" onclick="toggleHistory(${index})">
            <span>${item.title}</span>
            <span>▼</span>
          </div>
          <div class="history-body" id="histBody_${index}">${item.content}</div>
        `;
        container.appendChild(card);
      });
    }

    function toggleHistory(index) {
      const el = document.getElementById(`histBody_${index}`);
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function clearCurrentResults() {
      if (!confirm('Очистить все введенные веса и галочки на сегодня?')) return;
      Object.keys(localStorage).forEach(key => {
        if (key.includes('_w') || key.includes('_r') || key.includes('_c')) {
          localStorage.removeItem(key);
        }
      });
      render();
    }

    function downloadBackup() {
      const backupData = { localStorageData: { ...localStorage } };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `workout_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function restoreBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && imported.localStorageData) {
            localStorage.clear();
            Object.keys(imported.localStorageData).forEach(key => {
              localStorage.setItem(key, imported.localStorageData[key]);
            });
            alert('✅ Данные успешно восстановлены!');
            location.reload();
          } else { alert('Некорректный файл бэкапа!'); }
        } catch (err) { alert('Ошибка при чтении файла!'); }
      };
      reader.readAsText(file);
    }

    function importProgram() {
      const jsonText = document.getElementById('importInput').value.trim();
      if (!jsonText) return alert('Вставьте JSON код!');

      try {
        const newData = JSON.parse(jsonText);
        if (Array.isArray(newData)) {
          workoutData = newData;
          persistAndRender();
          document.getElementById('importInput').value = '';
          alert('🚀 Новый план загружен!');
        } else alert('Ошибка в формате!');
      } catch (e) { alert('Неверный формат кода!'); }
    }

    function render() {
      renderDaysNav();
      renderExercises();
    }

    function persistAndRender() {
      localStorage.setItem('my_full_workout_v3', JSON.stringify(workoutData));
      render();
    }

    let deferredPrompt;
    const installBtn = document.getElementById('pwaInstallBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') { installBtn.style.display = 'none'; }
        deferredPrompt = null;
      } else {
        alert('Нажмите 3 точки в углу браузера (⋮) и выберите "Добавить на главный экран"');
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    initStartDate();
    renderHistory();
    render();
  </script>
</body>
</html>
