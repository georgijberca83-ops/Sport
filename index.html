<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дневник тренировок</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#121212">
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      margin: 0;
      padding: 12px;
      padding-bottom: 40px;
    }

    h1 {
      font-size: 1.2rem;
      text-align: center;
      color: #4da6ff;
      margin: 10px 0;
    }

    #pwaInstallBtn {
      display: block;
      width: 100%;
      padding: 12px;
      background: #28a745;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Навигация по дням */
    .days-nav {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
    }

    .day-tab {
      flex: 1;
      padding: 10px 4px;
      background: #222;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
      text-align: center;
      white-space: nowrap;
    }

    .day-tab.active {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
    }

    .btn-add-day {
      padding: 10px 12px;
      background: #1e1e1e;
      border: 1px dashed #28a745;
      color: #28a745;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    /* Форма добавления/редактирования */
    .add-card {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #2a2a2a;
    }

    .form-group { margin-bottom: 8px; }

    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      background: #121212;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
    }

    .btn-main {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Карточки упражнений */
    .exercise-card {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #2a2a2a;
    }

    .ex-title {
      font-weight: bold;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .ex-target {
      font-size: 0.75rem;
      color: #4da6ff;
      margin-bottom: 8px;
    }

    .set-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.8rem;
      background: #262626;
      padding: 4px 8px;
      border-radius: 6px;
    }

    input[type="number"] {
      width: 50px;
      padding: 4px;
      border: 1px solid #444;
      background: #121212;
      color: #fff;
      border-radius: 4px;
      text-align: center;
      font-size: 0.85rem;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #007bff;
      margin-left: auto;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-small {
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .btn-edit { background: #4b5563; color: white; }
    .btn-delete { background: #dc3545; color: white; }

    /* Блок Импорта / Экспорта */
    .sync-card {
      background: #1a1a24;
      border: 1px solid #3b3b58;
      border-radius: 10px;
      padding: 12px;
      margin-top: 24px;
    }

    .sync-title {
      font-weight: bold;
      font-size: 0.9rem;
      color: #a5b4fc;
      margin-bottom: 8px;
      text-align: center;
    }

    .btn-sync {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-clear {
      background: #374151;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <h1>🏋️‍♂️ Трекер рекомпозиции</h1>

  <button id="pwaInstallBtn">📲 Установить приложение</button>

  <div class="days-nav" id="daysNav"></div>

  <div class="day-header">
    <h3 id="currentDayTitle" style="margin: 0; color:#4da6ff;">День 1</h3>
    <button class="btn-small btn-delete" onclick="deleteCurrentDay()">🗑 Удалить день</button>
  </div>

  <!-- Форма добавления/изменения -->
  <div class="add-card">
    <span id="form-title" style="font-weight:bold; font-size:0.85rem; display:block; margin-bottom:8px;">+ Добавить упражнение</span>
    <input type="hidden" id="editIndex" value="-1">
    <div class="form-group">
      <input type="text" id="exName" placeholder="Название упражнения">
    </div>
    <div class="form-group">
      <input type="text" id="exTarget" placeholder="Цель (например: 14-16 кг × 10-12)">
    </div>
    <button class="btn-main" onclick="saveExercise()">Сохранить</button>
  </div>

  <div id="exercisesContainer"></div>

  <!-- Блок обмена данными с ИИ-тренером -->
  <div class="sync-card">
    <div class="sync-title">🔄 Синхронизация с тренером</div>
    
    <button class="btn-sync" onclick="exportReport()">📋 Скопировать отчет недели</button>
    <button class="btn-small btn-clear" style="width:100%; margin-bottom:12px;" onclick="clearCurrentResults()">🧹 Очистить результаты сетов</button>

    <div style="font-size:0.75rem; color:#aaa; margin-bottom:4px;">Вставить новую программу от тренера (JSON):</div>
    <textarea id="importInput" rows="3" placeholder="Вставьте сюда скопированный JSON-код программы..."></textarea>
    <button class="btn-sync" style="background:#10b981; margin-top:6px; margin-bottom:0;" onclick="importProgram()">📥 Загрузить новый план</button>
  </div>

  <script>
    const originalProgram = [
      {
        dayName: 'День 1',
        exercises: [
          { name: 'Жим гантелей лежа', target: 'Цель: 14-16 кг × 10-12', sets: 4 },
          { name: 'Брусья (негативы)', target: 'Цель: Свой вес × 6-8', sets: 4 },
          { name: 'Жим гантелей сидя', target: 'Цель: 8-10 кг × 10-12', sets: 3 },
          { name: 'Махи в стороны', target: 'Цель: 4-6 кг × 12-15', sets: 3 },
          { name: 'Отжимания от скамьи', target: 'Цель: Свой вес × 10-12', sets: 3 }
        ]
      },
      {
        dayName: 'День 2',
        exercises: [
          { name: 'Подтягивания', target: 'Цель: Свой вес × MAX', sets: 3 },
          { name: 'Тяга гантели к поясу', target: 'Цель: 16-18 кг × 10-12', sets: 4 },
          { name: 'Махи в наклоне', target: 'Цель: 4-6 кг × 12-15', sets: 3 },
          { name: "Сгибания 'Молот'", target: 'Цель: 8-10 кг × 10-12', sets: 4 },
          { name: 'Подъем ног в висе', target: 'Цель: Свой вес × 8-12', sets: 3 }
        ]
      },
      {
        dayName: 'День 3',
        exercises: [
          { name: 'Скакалка', target: 'Цель: 3 раунда × 2 мин', sets: 3 },
          { name: 'Зашагивания на скамью', target: 'Цель: 8-10 кг × 10-12', sets: 4 },
          { name: 'Румынская тяга', target: 'Цель: 12-15 кг × 12', sets: 4 },
          { name: 'Забеги по лестнице', target: 'Цель: 5 подъемов', sets: 5 },
          { name: 'Подъемы на носки', target: 'Цель: Свой вес × 15-20', sets: 4 }
        ]
      }
    ];

    let workoutData = JSON.parse(localStorage.getItem('my_full_workout_v3')) || originalProgram;
    let activeDayIndex = 0;

    function renderDaysNav() {
      const nav = document.getElementById('daysNav');
      nav.innerHTML = '';

      workoutData.forEach((day, index) => {
        const btn = document.createElement('button');
        btn.className = `day-tab ${index === activeDayIndex ? 'active' : ''}`;
        btn.innerText = day.dayName;
        btn.onclick = () => {
          activeDayIndex = index;
          render();
        };
        nav.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'btn-add-day';
      addBtn.innerText = '+ День';
      addBtn.onclick = addNewDay;
      nav.appendChild(addBtn);
    }

    function renderExercises() {
      const container = document.getElementById('exercisesContainer');
      const currentDay = workoutData[activeDayIndex];
      document.getElementById('currentDayTitle').innerText = currentDay.dayName;

      container.innerHTML = '';

      if (!currentDay.exercises || currentDay.exercises.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#777; font-size:0.85rem;">Нет упражнений в этом дне.</p>';
        return;
      }

      currentDay.exercises.forEach((ex, exIdx) => {
        const setsCount = ex.sets || 4;
        let setsHtml = '';

        for (let s = 1; s <= setsCount; s++) {
          const key = `d${activeDayIndex}_e${exIdx}_s${s}`;
          const savedW = localStorage.getItem(key + '_w') || '';
          const savedR = localStorage.getItem(key + '_r') || '';
          const savedC = localStorage.getItem(key + '_c') === 'true' ? 'checked' : '';

          setsHtml += `
            <div class="set-row">
              <span>Сет ${s}:</span>
              <input type="number" placeholder="кг" value="${savedW}" oninput="saveVal('${key}_w', this.value)">
              <span>кг ×</span>
              <input type="number" placeholder="повт" value="${savedR}" oninput="saveVal('${key}_r', this.value)">
              <input type="checkbox" ${savedC} onclick="saveVal('${key}_c', this.checked)">
            </div>
          `;
        }

        const card = document.createElement('div');
        card.className = 'exercise-card';
        card.innerHTML = `
          <div class="ex-title">${ex.name}</div>
          <div class="ex-target">${ex.target}</div>
          <div>${setsHtml}</div>
          <div class="actions">
            <button class="btn-small btn-edit" onclick="editExercise(${exIdx})">✏️ Изменить</button>
            <button class="btn-small btn-delete" onclick="deleteExercise(${exIdx})">🗑 Удалить</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function saveVal(key, val) { localStorage.setItem(key, val); }

    function saveExercise() {
      const nameInput = document.getElementById('exName');
      const targetInput = document.getElementById('exTarget');
      const editIndex = parseInt(document.getElementById('editIndex').value);

      if (!nameInput.value.trim()) {
        alert('Введите название упражнения!');
        return;
      }

      const item = {
        name: nameInput.value.trim(),
        target: targetInput.value.trim() ? targetInput.value.trim() : 'Цель не указана',
        sets: 4
      };

      if (editIndex === -1) {
        workoutData[activeDayIndex].exercises.push(item);
      } else {
        workoutData[activeDayIndex].exercises[editIndex] = item;
        document.getElementById('editIndex').value = "-1";
        document.getElementById('form-title').innerText = "+ Добавить упражнение";
      }

      nameInput.value = '';
      targetInput.value = '';
      persistAndRender();
    }

    function addNewDay() {
      const name = prompt('Введите название дня:');
      if (name) {
        workoutData.push({ dayName: name, exercises: [] });
        activeDayIndex = workoutData.length - 1;
        persistAndRender();
      }
    }

    function deleteCurrentDay() {
      if (workoutData.length <= 1) return alert('Нельзя удалить единственный день!');
      if (confirm(`Удалить "${workoutData[activeDayIndex].dayName}"?`)) {
        workoutData.splice(activeDayIndex, 1);
        activeDayIndex = 0;
        persistAndRender();
      }
    }

    function editExercise(index) {
      const ex = workoutData[activeDayIndex].exercises[index];
      document.getElementById('exName').value = ex.name;
      document.getElementById('exTarget').value = ex.target;
      document.getElementById('editIndex').value = index;
      document.getElementById('form-title').innerText = "✏️ Изменить упражнение";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteExercise(index) {
      if (confirm('Удалить это упражнение?')) {
        workoutData[activeDayIndex].exercises.splice(index, 1);
        persistAndRender();
      }
    }

    // ЭКСПОРТ ОТЧЕТА ДЛЯ ЧАТА
    function exportReport() {
      let report = "📊 **ОТЧЕТ О ТРЕНИРОВКАХ ЗА НЕДЕЛЮ**\n\n";

      workoutData.forEach((day, dIdx) => {
        report += `═══ ${day.dayName.toUpperCase()} ═══\n`;
        day.exercises.forEach((ex, eIdx) => {
          report += `🔹 ${ex.name} (${ex.target})\n`;
          let setsDone = [];
          const setsCount = ex.sets || 4;
          for (let s = 1; s <= setsCount; s++) {
            const key = `d${dIdx}_e${eIdx}_s${s}`;
            const w = localStorage.getItem(key + '_w');
            const r = localStorage.getItem(key + '_r');
            const c = localStorage.getItem(key + '_c') === 'true';
            
            if (w || r || c) {
              setsDone.push(`Сет ${s}: ${w || 0}кг × ${r || 0} повт ${c ? '✅' : '❌'}`);
            }
          }
          if (setsDone.length > 0) {
            report += "   " + setsDone.join("\n   ") + "\n";
          } else {
            report += "   (Нет записей)\n";
          }
        });
        report += "\n";
      });

      navigator.clipboard.writeText(report).then(() => {
        alert('✅ Отчет скопирован в буфер обмена! Просто вставьте его в чат.');
      }).catch(err => {
        alert('Скопируйте вручную:\n\n' + report);
      });
    }

    // ИМПОРТ НОВОГО ПЛАНА
    function importProgram() {
      const jsonText = document.getElementById('importInput').value.trim();
      if (!jsonText) return alert('Вставьте JSON код!');

      try {
        const newData = JSON.parse(jsonText);
        if (Array.isArray(newData)) {
          workoutData = newData;
          persistAndRender();
          clearCurrentResults();
          document.getElementById('importInput').value = '';
          alert('🚀 Новый план успешно загружен!');
        } else {
          alert('Ошибка в формате данных!');
        }
      } catch (e) {
        alert('Неверный формат кода. Убедитесь, что скопировали код целиком!');
      }
    }

    // Очистить выполненные сеты (перед новой неделей)
    function clearCurrentResults() {
      Object.keys(localStorage).forEach(key => {
        if (key.includes('_w') || key.includes('_r') || key.includes('_c')) {
          localStorage.removeItem(key);
        }
      });
      render();
    }

    function render() {
      renderDaysNav();
      renderExercises();
    }

    function persistAndRender() {
      localStorage.setItem('my_full_workout_v3', JSON.stringify(workoutData));
      render();
    }

    let deferredPrompt;
    const installBtn = document.getElementById('pwaInstallBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') { installBtn.style.display = 'none'; }
        deferredPrompt = null;
      } else {
        alert('Нажмите 3 точки в углу браузера (⋮) и выберите "Добавить на главный экран" или "Установить приложение"');
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    render();
  </script>
</body>
</html>
